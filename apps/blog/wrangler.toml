# Despliegue de BLOG IA en la cuenta de Cloudflare de Milton (2026-10-21).
# NO contiene secretos: `INGEST_SECRET` se crea con `wrangler secret put INGEST_SECRET`.
# Los IDs de recursos de Cloudflare no son secretos.
name = "blog-ia"
main = "src/worker.ts"
compatibility_date = "2026-10-20"
# Worker NUEVO e independiente: no toca ninguno de los Workers existentes de la cuenta.
workers_dev = true

[vars]
# Host de la API de ingestión: el host *.workers.dev del propio Worker (sin tocar DNS).
API_HOST = "blog-ia.10minuteswebsite.workers.dev"
INGEST_RATE_LIMIT = "60"

[[d1_databases]]
binding = "DB"
database_name = "blog-ia"
database_id = "a9556210-7b55-493b-bf1e-f0cb73f2a775"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blog-ia-media"
