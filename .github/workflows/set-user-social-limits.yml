name: Cupo social de UN usuario (temporal)

# Sube o restaura el cupo diario por red de un solo usuario. Ver apps/worker/src/set-user-social-limits.ts.

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: "Correo del usuario"
        required: true
        type: string
      mode:
        description: "raise o restore"
        required: true
        type: string
      original_limits:
        description: "Solo para restore: JSON original impreso por raise"
        required: false
        type: string

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      USER_EMAIL: ${{ inputs.user_email }}
      MODE: ${{ inputs.mode }}
      ORIGINAL_LIMITS: ${{ inputs.original_limits }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Ajustar cupo
        working-directory: apps/worker
        run: npx tsx src/set-user-social-limits.ts
