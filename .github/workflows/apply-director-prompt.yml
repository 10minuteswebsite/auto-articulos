name: Prompt del Director Creativo de imágenes - aplicar / restaurar

# Aplica el prompt nuevo (apps/worker/src/directorPromptV2.ts) en el ajuste global
# `ai_social_image_prompt`, guardando antes una copia exacta del actual, o restaura esa
# copia. Se dispara a mano. Mismo ajuste que se edita en Administración → «Prompts».
#   gh workflow run apply-director-prompt.yml -f mode=aplicar
#   gh workflow run apply-director-prompt.yml -f mode=restaurar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "aplicar (respaldo + prompt del panel con la guía añadida) | reemplazar (respaldo + solo el v2 corto) | restaurar (vuelve al respaldo)"
        required: true
        default: "aplicar"

concurrency:
  group: apply-director-prompt
  cancel-in-progress: false

jobs:
  prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
      DIRECTOR_MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Aplicar o restaurar
        working-directory: apps/worker
        run: npx tsx src/apply-director-prompt.ts
