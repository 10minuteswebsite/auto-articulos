name: Sincronizar usuarios con el Hub

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      hub_base_url:
        description: "Hub endpoint to use for this synchronization"
        required: false
        default: "https://staging-hub.lasolucionweb.net"

concurrency:
  group: auto-articulos-hub-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      HUB_BASE_URL: ${{ inputs.hub_base_url || 'https://staging-hub.lasolucionweb.net' }}
      AUTO_ARTICULOS_HUB_CLIENT_ID: ${{ secrets.AUTO_ARTICULOS_HUB_CLIENT_ID }}
      AUTO_ARTICULOS_HUB_CLIENT_SECRET: ${{ secrets.AUTO_ARTICULOS_HUB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Sincronizar usuarios
        run: npm run sync:hub-users
