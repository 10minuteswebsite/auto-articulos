name: Sincronizar usuarios con el Hub

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Verify authentication without synchronizing customer data"
        type: boolean
        default: false
      hub_base_url:
        description: "Hub endpoint to use for this synchronization"
        required: false
        default: "https://hub.lasolucionweb.net"

concurrency:
  group: auto-articulos-hub-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUB_SYNC_VERIFY_ONLY: ${{ inputs.verify_only }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      HUB_BASE_URL: ${{ inputs.hub_base_url || 'https://hub.lasolucionweb.net' }}
      AUTO_ARTICULOS_HUB_CLIENT_ID: ${{ secrets.AUTO_ARTICULOS_HUB_CLIENT_ID }}
      HUB_CREDENTIAL_TRANSPORT: shared
      HUB_WORKLOAD_IDENTITY: github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Sincronizar usuarios
        run: npm run sync:hub-users
